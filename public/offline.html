<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A posto — sin conexión</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #064e3b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 26rem; padding: 2rem 1.25rem; text-align: center; }
      img { width: 9rem; height: 9rem; }
      h1 { font-size: 1.4rem; margin: 0.5rem 0; }
      p { color: #3f4a45; line-height: 1.5; margin: 0.4rem 0; }
      button { margin-top: 1.2rem; min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: 999px; background: #16a34a; color: #fff; font-size: 1rem; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-aposto.svg" alt="a posto" />
      <h1>Sin conexión</h1>
      <p>No hay conexión a internet. Vuelve a intentarlo cuando la tengas.</p>
      <p lang="it">Nessuna connessione a internet. Riprova quando torni online.</p>
      <p lang="en">No internet connection. Please try again when you are back online.</p>
      <button type="button" onclick="location.reload()">Reintentar · Riprova · Retry</button>
    </main>
  </body>
</html>
